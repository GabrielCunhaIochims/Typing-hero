<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypingHero</title>
    <link rel="stylesheet" href="CSS/game.css">
    <link rel="stylesheet" href="CSS/main.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="top-auth-bar">
        <div class="user-status">
          <span class="user-icon">👤</span>
          <span id="userInfo">Carregando...</span>
        </div>
        <a id="authActionBtn" href="auth.html" class="auth-btn">
          <span>Entrar / Cadastrar</span>
        </a>
      </div>
    
      <div class="screen-flash" id="screenFlash"></div>
    
      <button id="quitBtn" onclick="returnToMenu()">SAIR / MENU</button>
    
      <audio id="menuMusic" loop></audio>
      <audio id="gameMusic" loop></audio>
    
      <div class="bg-grid"></div>
      <div class="bg-glow"></div>
      <div class="bg-glow"></div>
    
      <!-- Componente de Rank Up no Canto Superior Direito -->
      <div class="rank-up-overlay" id="rankUpOverlay">
        <div class="rank-up-title">RANK UP!</div>
        <div class="rank-badge-container" id="rankBadgeContainer">
          <div class="rank-up-badge" id="rankUpBadge">A</div>
          <div class="rank-up-shockwave" id="rankUpShockwave"></div>
        </div>
      </div>
    
      <h1>TYPING HERO</h1>
      <p class="subtitle">Escolha o seu ritmo e digite com precisão</p>
    
      <div class="song-selector-container">
        <span class="song-selector-label">Música / Tema:</span>
        <select id="songSelect" class="song-select"></select>
      </div>
    
      <div class="hud">
        <div class="stat-box">
          <div class="stat-label">Pontuação</div>
          <div class="stat-value" id="scoreValue">0</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Hype Rank</div>
          <div class="stat-value" id="hypeValue">D</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Combo</div>
          <div class="stat-value" id="comboValue">0x</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">WPM</div>
          <div class="stat-value" id="wpmValue">0</div>
        </div>
      </div>
    
      <div class="hype-bar-container">
        <div class="hype-bar" id="hypeBar"></div>
      </div>
    
      <div id="game"></div>
    
      <div class="timer-bar">
        <div class="timer-fill" id="timerFill"></div>
      </div>
    
      <div id="inputArea">
        <div class="input-wrapper">
          <input type="text" id="playerInput" placeholder="Clique em PLAY para começar..." disabled autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="text">
        </div>
        <button class="btn btn-primary" id="playBtn">PLAY</button>
      </div>
    
      <div class="overlay" id="gameOverOverlay">
        <h2>GAME OVER</h2>
        <div class="overlay-stats">
          <div class="stat-box">
            <div class="stat-label">Pontuação Final</div>
            <div class="stat-value" id="finalScore">0</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Maior Rank</div>
            <div class="stat-value" id="finalRank" style="color: #ff0066;">D</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Máx WPM</div>
            <div class="stat-value" id="finalWpm">0</div>
          </div>
        </div>
        <div class="btn-group">
          <button class="btn btn-primary" id="restartBtn">JOGAR NOVAMENTE</button>
          <button class="btn btn-secondary" id="menuBtn">MENU PRINCIPAL</button>
        </div>
      </div>

    <!-- SDK do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Módulos da Aplicação -->
    <script src="JS/supabase.js"></script>
    <script src="JS/auth.js"></script>
    <script src="JS/audio.js"></script>
    <script src="JS/leaderboard.js"></script>
    <script src="JS/game.js"></script>
</body>
</html>
