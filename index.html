<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Typing Hero - Ultra Rank Up Edition</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #0a0a0f;
      color: #e0e0e0;
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      transition: background 0.3s ease;
      position: relative;
      padding: 10px;
    }

    /* Screen Shake Global */
    @keyframes screen-shake-anim {
      0%, 100% { transform: translate(0, 0); }
      10%, 30%, 50%, 70%, 90% { transform: translate(-8px, 8px); }
      20%, 40%, 60%, 80% { transform: translate(8px, -8px); }
    }

    @keyframes mega-shake-anim {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      10%, 30%, 50%, 70%, 90% { transform: translate(-14px, 14px) rotate(-1deg); }
      20%, 40%, 60%, 80% { transform: translate(14px, -14px) rotate(1deg); }
    }

    body.screen-shake { animation: screen-shake-anim 0.4s ease-in-out; }
    body.mega-shake { animation: mega-shake-anim 0.6s ease-in-out; }

    /* Flash de Tela Branca */
    .screen-flash {
      position: fixed;
      inset: 0;
      background: #ffffff;
      opacity: 0;
      pointer-events: none;
      z-index: 300;
      transition: opacity 0.05s ease-out;
    }

    .screen-flash.active {
      opacity: 0.8;
      transition: opacity 0.6s cubic-bezier(0.1, 1, 0.1, 1);
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0, 255, 136, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 136, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 0;
    }

    .bg-glow {
      position: fixed;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.15;
      pointer-events: none;
      z-index: 0;
      animation: float 8s ease-in-out infinite;
    }

    .bg-glow:nth-child(1) { background: #00ff88; top: -200px; left: -200px; animation-delay: 0s; }
    .bg-glow:nth-child(2) { background: #ff0066; bottom: -200px; right: -200px; animation-delay: 4s; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(50px, 30px) scale(1.1); }
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 3.5rem;
      font-weight: 900;
      margin: 20px 0 5px;
      background: linear-gradient(135deg, #00ff88, #00ccff, #ff0066);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      position: relative;
      z-index: 1;
      letter-spacing: 4px;
      text-align: center;
    }

    .subtitle {
      color: #666;
      font-size: 1rem;
      margin-bottom: 15px;
      z-index: 1;
      text-transform: uppercase;
      letter-spacing: 6px;
      text-align: center;
    }

    #quitBtn {
      position: absolute;
      top: 20px;
      left: 20px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      padding: 8px 16px;
      background: rgba(255, 51, 51, 0.1);
      border: 1px solid rgba(255, 51, 51, 0.3);
      color: #ff5555;
      border-radius: 8px;
      cursor: pointer;
      z-index: 10;
      display: none;
      transition: all 0.2s ease;
    }

    #quitBtn:hover {
      background: rgba(255, 51, 51, 0.3);
      border-color: #ff3333;
      color: #fff;
    }

    .song-selector-container {
      z-index: 2;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.05);
      padding: 8px 18px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      max-width: 100%;
      flex-wrap: wrap;
      justify-content: center;
    }

    .song-selector-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      color: #00ff88;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    select.song-select {
      background: #12121a;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      border: 1px solid #00ff88;
      border-radius: 8px;
      padding: 5px 12px;
      outline: none;
      cursor: pointer;
      transition: all 0.3s;
      max-width: 100%;
    }

    select.song-select:hover { box-shadow: 0 0 10px rgba(0, 255, 136, 0.4); }

    .hud {
      display: flex;
      gap: 20px;
      margin-bottom: 15px;
      z-index: 1;
      width: 100%;
      max-width: 850px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 12px 20px;
      text-align: center;
      min-width: 120px;
      backdrop-filter: blur(10px);
      transition: transform 0.2s, border-color 0.2s;
      flex: 1;
    }

    .stat-box:hover {
      transform: translateY(-3px);
      border-color: rgba(0, 255, 136, 0.2);
    }

    .stat-label {
      font-size: 0.8rem;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .stat-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
    }

    #scoreValue { color: #00ff88; }
    #hypeValue { 
      color: #ff0066; 
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: inline-block;
    }
    #comboValue { color: #ffcc00; }
    #wpmValue { color: #00ccff; }

    .hype-bar-container {
      width: 400px;
      max-width: 90vw;
      height: 8px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      margin-bottom: 20px;
      overflow: hidden;
      z-index: 1;
    }

    .hype-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #666, #00ccff, #00ff88, #ffcc00, #ff0066);
      border-radius: 4px;
      transition: width 0.15s ease;
      box-shadow: 0 0 20px rgba(255, 0, 102, 0.4);
    }

    #game {
      width: 850px;
      max-width: 95vw;
      min-height: 120px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 30px 40px;
      font-size: 1.6rem;
      line-height: 2;
      position: relative;
      z-index: 1;
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 2px;
      transition: border-color 0.3s, box-shadow 0.3s;
      cursor: pointer;
    }

    @keyframes game-shake {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(-2px, 1px) scale(1.02); box-shadow: 0 0 40px rgba(255, 0, 102, 0.6); border-color: rgba(255, 0, 102, 0.8);}
      50% { transform: translate(2px, -1px) scale(1.01); box-shadow: 0 0 20px rgba(255, 0, 102, 0.4); border-color: rgba(255, 0, 102, 0.5);}
      75% { transform: translate(-1px, -2px) scale(1.02); box-shadow: 0 0 50px rgba(255, 0, 102, 0.7); border-color: rgba(255, 0, 102, 1);}
    }

    #game.s-rank-active { animation: game-shake 0.3s infinite alternate; }

    .char {
      display: inline-block;
      min-width: 14px;
      text-align: center;
      transition: all 0.15s ease;
      border-radius: 4px;
      padding: 2px 4px;
    }

    .char.pending { color: #666; }
    .char.correct {
      color: #00ff88;
      text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
      background: rgba(0, 255, 136, 0.08);
    }
    .char.wrong {
      color: #ff3333;
      text-shadow: 0 0 10px rgba(255, 51, 51, 0.5);
      background: rgba(255, 51, 51, 0.15);
      animation: shake 0.3s ease;
    }
    .char.current {
      background: rgba(0, 255, 136, 0.2);
      color: #fff;
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-3px); }
      80% { transform: translateX(3px); }
    }

    #inputArea {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      z-index: 1;
      width: 100%;
    }

    .input-wrapper {
      position: relative;
      width: 650px;
      max-width: 90vw;
    }

    #playerInput {
      width: 100%;
      font-size: 1.3rem;
      font-family: 'Rajdhani', sans-serif;
      padding: 16px 25px;
      background: rgba(255, 255, 255, 0.03);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      color: #fff;
      outline: none;
      transition: all 0.3s ease;
      text-align: center;
      letter-spacing: 1px;
    }

    #playerInput::placeholder { color: #555; }
    #playerInput:focus {
      border-color: rgba(0, 255, 136, 0.4);
      box-shadow: 0 0 30px rgba(0, 255, 136, 0.1);
    }
    #playerInput.s-rank-active {
        border-color: #ff0066;
        box-shadow: 0 0 20px rgba(255, 0, 102, 0.5);
    }
    #playerInput:disabled { opacity: 0.4; cursor: not-allowed; }
    #playerInput.error {
      border-color: rgba(255, 51, 51, 0.6);
      animation: shake 0.3s ease;
    }

    .btn-group { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }

    .btn {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 16px 40px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
      position: relative;
      overflow: hidden;
    }

    .btn-primary {
      background: linear-gradient(135deg, #00ff88, #00cc66);
      color: #0a0a0f;
      box-shadow: 0 10px 40px rgba(0, 255, 136, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 50px rgba(0, 255, 136, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #e0e0e0;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-3px);
      color: #fff;
    }

    /* SISTEMA DE ANIMAÇÃO DE RANK UP NO CANTO SUPERIOR DIREITO */
    .rank-up-overlay {
      position: fixed;
      top: 24px;
      right: 24px;
      pointer-events: none;
      z-index: 250;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      opacity: 0;
      transform: translateY(-20px) scale(0.9);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .rank-up-overlay.active {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .rank-up-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 0.9rem;
      font-weight: 900;
      color: #fff;
      letter-spacing: 4px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
      margin-bottom: 4px;
    }

    /* Badge Estilizado Glassmorphism para Ranks */
    .rank-badge-container {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 70px;
      height: 60px;
      padding: 0 18px;
      border-radius: 14px;
      background: rgba(15, 15, 20, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
    }

    .rank-up-badge {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.4rem;
      font-weight: 900;
      line-height: 1;
      color: var(--rank-color);
      text-shadow: 0 0 15px var(--rank-color);
    }

    /* Estilização Premium para Rank S em diante */
    .rank-badge-container.is-rank-s {
      border: 2px solid transparent;
      background-image: linear-gradient(rgba(15, 15, 20, 0.9), rgba(15, 15, 20, 0.9)), 
                        linear-gradient(135deg, #FFE259 0%, #FFA751 100%);
      background-origin: border-box;
      background-clip: padding-box, border-box;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 20px rgba(255, 167, 81, 0.4);
    }

    .rank-badge-container.is-rank-s .rank-up-badge {
      background: linear-gradient(180deg, #FFFFFF 0%, #FFE259 45%, #FFA751 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.8));
    }

    .rank-up-shockwave {
      position: absolute;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid var(--rank-color);
      box-shadow: 0 0 15px var(--rank-color);
      opacity: 1;
      animation: shockwave-expand 0.6s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }

    @keyframes shockwave-expand {
      0% { width: 40px; height: 40px; opacity: 1; border-width: 6px; }
      100% { width: 300px; height: 300px; opacity: 0; border-width: 1px; }
    }

    .particle {
      position: fixed;
      pointer-events: none;
      border-radius: 50%;
      animation: particle-fly 0.8s ease-out forwards;
      z-index: 100;
    }

    @keyframes particle-fly {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0); }
    }

    .time-pop {
      position: fixed;
      font-family: 'Orbitron', sans-serif;
      font-size: 1.4rem;
      font-weight: 900;
      pointer-events: none;
      animation: float-up 0.8s ease-out forwards;
      z-index: 101;
    }

    .time-pop.negative { color: #ff3333; text-shadow: 0 0 15px rgba(255, 51, 51, 0.8); }
    .time-pop.positive { color: #00ff88; text-shadow: 0 0 15px rgba(0, 255, 136, 0.8); }

    @keyframes float-up {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-30px); }
    }

    .combo-popup {
      position: fixed;
      font-family: 'Orbitron', sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      color: #ffcc00;
      text-shadow: 0 0 30px rgba(255, 204, 0, 0.8);
      pointer-events: none;
      animation: combo-pop 0.8s ease-out forwards;
      z-index: 100;
    }

    @keyframes combo-pop {
      0% { opacity: 0; transform: scale(0.5) translateY(20px); }
      30% { opacity: 1; transform: scale(1.2) translateY(-10px); }
      100% { opacity: 0; transform: scale(1) translateY(-60px); }
    }

    body.frenzy { animation: frenzy-bg 0.5s ease infinite alternate; }
    @keyframes frenzy-bg {
      from { background: #0a0a0f; }
      to { background: #1a0a15; }
    }

    .timer-bar {
      width: 400px;
      max-width: 90vw;
      height: 4px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 2px;
      margin-top: 15px;
      overflow: hidden;
      z-index: 1;
    }

    .timer-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #00ccff, #00ff88);
      border-radius: 2px;
      transition: width 0.1s linear, background 0.3s ease;
    }

    .timer-fill.danger { background: linear-gradient(90deg, #ff6600, #ff0066); }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 15, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      padding: 20px;
    }

    .overlay.active { opacity: 1; pointer-events: all; }
    .overlay h2 { font-family: 'Orbitron', sans-serif; font-size: 3rem; margin-bottom: 20px; text-align: center; }
    .overlay-stats { display: flex; gap: 20px; margin: 20px 0 40px; flex-wrap: wrap; justify-content: center; }

    /* AJUSTES RESPONSIVOS PARA DISPOSITIVOS MÓVEIS */
    @media (max-width: 768px) {
      h1 { font-size: 2.2rem; margin-top: 40px; }
      .subtitle { font-size: 0.8rem; letter-spacing: 3px; }
      
      .hud { gap: 8px; }
      .stat-box { padding: 8px 10px; min-width: 75px; }
      .stat-label { font-size: 0.65rem; letter-spacing: 1px; }
      .stat-value { font-size: 1.3rem; }

      #game {
        padding: 15px 20px;
        font-size: 1.2rem;
        line-height: 1.6;
        min-height: 100px;
      }

      #playerInput {
        font-size: 16px; /* Evita auto-zoom do iOS/Android */
        padding: 12px 15px;
      }

      #quitBtn {
        top: 10px;
        left: 10px;
        font-size: 0.75rem;
        padding: 6px 12px;
      }

      .rank-up-overlay {
        top: 10px;
        right: 10px;
      }

      .rank-badge-container {
        min-width: 50px;
        height: 45px;
        padding: 0 12px;
      }

      .rank-up-badge {
        font-size: 1.6rem;
      }

      .rank-up-title {
        font-size: 0.75rem;
        letter-spacing: 2px;
      }

      .btn {
        padding: 12px 24px;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>

  <div class="screen-flash" id="screenFlash"></div>

  <button id="quitBtn" onclick="returnToMenu()">SAIR / MENU</button>

  <audio id="menuMusic" loop></audio>
  <audio id="gameMusic" loop></audio>

  <div class="bg-grid"></div>
  <div class="bg-glow"></div>
  <div class="bg-glow"></div>

  <!-- Componente de Rank Up no Canto Superior Direito -->
  <div class="rank-up-overlay" id="rankUpOverlay">
    <div class="rank-up-title">RANK UP!</div>
    <div class="rank-badge-container" id="rankBadgeContainer">
      <div class="rank-up-badge" id="rankUpBadge">A</div>
      <div class="rank-up-shockwave" id="rankUpShockwave"></div>
    </div>
  </div>

  <h1>TYPING HERO</h1>
  <p class="subtitle">Escolha o seu ritmo e digite com precisão</p>

  <div class="song-selector-container">
    <span class="song-selector-label">Música / Tema:</span>
    <select id="songSelect" class="song-select"></select>
  </div>

  <div class="hud">
    <div class="stat-box">
      <div class="stat-label">Pontuação</div>
      <div class="stat-value" id="scoreValue">0</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Hype Rank</div>
      <div class="stat-value" id="hypeValue">D</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Combo</div>
      <div class="stat-value" id="comboValue">0x</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">WPM</div>
      <div class="stat-value" id="wpmValue">0</div>
    </div>
  </div>

  <div class="hype-bar-container">
    <div class="hype-bar" id="hypeBar"></div>
  </div>

  <div id="game"></div>

  <div class="timer-bar">
    <div class="timer-fill" id="timerFill"></div>
  </div>

  <div id="inputArea">
    <div class="input-wrapper">
      <input type="text" id="playerInput" placeholder="Clique em PLAY para começar..." disabled autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="text">
    </div>
    <button class="btn btn-primary" id="playBtn">PLAY</button>
  </div>

  <div class="overlay" id="gameOverOverlay">
    <h2>GAME OVER</h2>
    <div class="overlay-stats">
      <div class="stat-box">
        <div class="stat-label">Pontuação Final</div>
        <div class="stat-value" id="finalScore">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Maior Rank</div>
        <div class="stat-value" id="finalRank" style="color: #ff0066;">D</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Máx WPM</div>
        <div class="stat-value" id="finalWpm">0</div>
      </div>
    </div>
    <div class="btn-group">
      <button class="btn btn-primary" id="restartBtn">JOGAR NOVAMENTE</button>
      <button class="btn btn-secondary" id="menuBtn">MENU PRINCIPAL</button>
    </div>
  </div>

  <script>
    const MUSIC_LIBRARY = {
      "hellfire": {
        title: "Hellfire Overdrive (Cyberpunk/Metal)",
        url: "https://cdn.discordapp.com/attachments/1534234222217134191/1534236824875040768/Hellfire_Overdrive.mp3?ex=6a7364e3&is=6a721363&hm=6c0134794f51da7552d836ed779cdbc34815e8365f3548aac0afc1a95865b9a2&.mp3",
        phrases: [
          "Seus dedos devem se mover mais rápido do que as chamas.",
          "Rompa a linha vermelha e abrace o caos.",
          "Sem freios, sem misericórdia, apenas sobrecarga pura.",
          "Sinta a descarga de adrenalina enquanto os riffs pesados levam o RPM além do rank S.",
          "Através da fumaça ardente, apenas os digitadores mais rápidos cruzarão a linha de chegada."
        ]
      },
      "nature": {
        title: "Nature Balance (Zen/Relaxante)",
        url: "https://cdn.discordapp.com/attachments/1534234222217134191/1534236824875040768/Hellfire_Overdrive.mp3",
        phrases: [
          "a"
        ]
      },
      "code_master": {
        title: "Code Runner (Synthwave / Tech)",
        url: "https://cdn.discordapp.com/attachments/1534234222217134191/1534261673173713046/Bitrush_Overdrive.mp3?ex=6a737c08&is=6a722a88&hm=9bf3c8315d03fdee588f14d1f5e5978179db80439b5a0f6f9397f56179d28167&.mp3",
        phrases: [
          "const hype = currentCombo * multiplier;",
          "if (typedChar === targetChar) score += 100;",
          "const V1 = document.getElementById('scoreValue'); V1.textContent = score;",
          "SEI : LDA #$7F : STA $DC0D : CLI",
          "sprite.x = sprite.x + speed;",
          "System.out.println('Keep typing, keep coding!');"
        ]
      }
    };


    const menuMusic = document.getElementById("menuMusic");
    const gameMusic = document.getElementById("gameMusic");
    const songSelect = document.getElementById("songSelect");
    const screenFlash = document.getElementById("screenFlash");

    Object.keys(MUSIC_LIBRARY).forEach(key => {
      const opt = document.createElement("option");
      opt.value = key;
      opt.textContent = MUSIC_LIBRARY[key].title;
      songSelect.appendChild(opt);
    });

    let currentSongKey = songSelect.value;

    function applySelectedSong(key) {
      currentSongKey = key;
      const songData = MUSIC_LIBRARY[key];
      menuMusic.src = songData.url;
      gameMusic.src = songData.url;
    }

    applySelectedSong(currentSongKey);

    songSelect.addEventListener("change", (e) => {
      applySelectedSong(e.target.value);
      if (!gameActive) {
        playMenuMusic();
      }
    });

    const BASE_VOLUME = 0.3;
    const MAX_VOLUME = 1.0;
    menuMusic.volume = BASE_VOLUME;
    gameMusic.volume = BASE_VOLUME;

    function fadeAudioVolume(audioElement, targetVolume, duration) {
        const step = 0.05;
        const intervalTime = duration / ((Math.abs(targetVolume - audioElement.volume)) / step);
        
        let fadeInterval = setInterval(() => {
            if (audioElement.volume < targetVolume) {
                audioElement.volume = Math.min(targetVolume, audioElement.volume + step);
            } else if (audioElement.volume > targetVolume) {
                audioElement.volume = Math.max(targetVolume, audioElement.volume - step);
            }

            if (Math.abs(audioElement.volume - targetVolume) < 0.01) {
                clearInterval(fadeInterval);
            }
        }, intervalTime);
    }

    function playMenuMusic() {
      gameMusic.pause();
      gameMusic.currentTime = 0;
      menuMusic.play().catch(e => console.log("Aguardando interação"));
    }

    function playGameMusic() {
      menuMusic.pause();
      menuMusic.currentTime = 0;
      gameMusic.play().catch(e => console.log("Erro áudio:", e));
    }

    window.addEventListener("click", function initMenuAudioOnFirstClick() {
      if (menuMusic.paused && !gameActive) {
        playMenuMusic();
      }
      window.removeEventListener("click", initMenuAudioOnFirstClick);
    });

    const game = document.getElementById("game");
    const scoreValue = document.getElementById("scoreValue");
    const hypeValue = document.getElementById("hypeValue");
    const comboValue = document.getElementById("comboValue");
    const wpmValue = document.getElementById("wpmValue");
    const hypeBar = document.getElementById("hypeBar");
    const input = document.getElementById("playerInput");
    const playBtn = document.getElementById("playBtn");
    const timerFill = document.getElementById("timerFill");
    const overlay = document.getElementById("gameOverOverlay");
    const restartBtn = document.getElementById("restartBtn");
    const menuBtn = document.getElementById("menuBtn");
    const quitBtn = document.getElementById("quitBtn");

    const rankUpOverlay = document.getElementById("rankUpOverlay");
    const rankUpBadge = document.getElementById("rankUpBadge");
    const rankBadgeContainer = document.getElementById("rankBadgeContainer");
    const rankUpShockwave = document.getElementById("rankUpShockwave");

    let score = 0;
    let hypePoints = 0;
    let combo = 0;
    const MAX_COMBO = 8;
    let text = "";
    let gameActive = false;
    let startTime = null;
    let charCount = 0;
    let maxWpm = 0;
    let timerInterval = null;
    let timeLeft = 60;
    let maxTime = 60;
    let correctCharsCount = 0;
    let isSRankActive = false;

    const RANKS = [
      { name: "D", min: 0, color: "#888888" },
      { name: "C", min: 10, color: "#00ccff" },
      { name: "B", min: 25, color: "#00ff88" },
      { name: "A", min: 45, color: "#ffcc00" },
      { name: "S", min: 70, color: "#ff9900" },
      { name: "SS", min: 100, color: "#ff0066" },
      { name: "SSS", min: 135, color: "#ff00cc" },
      { name: "HERO", min: 180, color: "#ffffff" }
    ];

    let highestRankIndex = 0;
    let currentRankIndex = 0;
    let previousRankIndex = 0;

    function getCurrentRank() {
      for (let i = RANKS.length - 1; i >= 0; i--) {
        if (hypePoints >= RANKS[i].min) {
          highestRankIndex = Math.max(highestRankIndex, i);
          currentRankIndex = i;
          return { ...RANKS[i], index: i };
        }
      }
      currentRankIndex = 0;
      return { ...RANKS[0], index: 0 };
    }

    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    function playSuccessSound(pitchBoost = 0) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = "sine";
      const baseFreq = 520 + (pitchBoost * 30);
      osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.25, audioCtx.currentTime + 0.04);

      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.04);
    }

    function playErrorSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(180, audioCtx.currentTime);
      osc.frequency.linearRampToValueAtTime(60, audioCtx.currentTime + 0.12);

      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    }

    function playRankUpSound(rankIndex) {
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = rankIndex >= 4 ? "triangle" : "sine";
      const startFreq = 300 + (rankIndex * 120);
      const endFreq = startFreq * 2.2;

      osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime + 0.4);

      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.6);
    }

    function triggerRankUpAnimation(rank) {
      rankUpBadge.textContent = rank.name;
      rankUpBadge.style.color = rank.color;
      rankUpOverlay.style.setProperty('--rank-color', rank.color);

      if (rank.index >= 4) {
        rankBadgeContainer.classList.add('is-rank-s');
      } else {
        rankBadgeContainer.classList.remove('is-rank-s');
      }

      if (rank.index >= 4) {
        document.body.classList.add('mega-shake');
        setTimeout(() => document.body.classList.remove('mega-shake'), 600);
      } else {
        document.body.classList.add('screen-shake');
        setTimeout(() => document.body.classList.remove('screen-shake'), 400);
      }

      if (rank.index >= 4) {
        screenFlash.classList.add('active');
        setTimeout(() => screenFlash.classList.remove('active'), 200);
      }

      const rect = rankBadgeContainer.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const particleCount = 12 + (rank.index * 6);

      for (let i = 0; i < particleCount; i++) {
        const p = document.createElement("div");
        p.className = "particle";
        const size = Math.random() * 6 + 4 + rank.index;
        p.style.width = size + "px";
        p.style.height = size + "px";
        p.style.background = rank.color;
        p.style.boxShadow = `0 0 12px ${rank.color}`;
        p.style.left = centerX + "px";
        p.style.top = centerY + "px";

        const angle = Math.random() * Math.PI * 2;
        const dist = 40 + Math.random() * (60 + rank.index * 15);

        p.style.setProperty("--tx", Math.cos(angle) * dist + "px");
        p.style.setProperty("--ty", Math.sin(angle) * dist + "px");

        document.body.appendChild(p);
        setTimeout(() => p.remove(), 800);
      }

      rankUpOverlay.classList.remove('active');
      rankUpShockwave.style.animation = 'none';
      void rankUpShockwave.offsetWidth; 
      rankUpShockwave.style.animation = 'shockwave-expand 0.6s cubic-bezier(0.1, 0.8, 0.3, 1) forwards';
      rankUpOverlay.classList.add('active');

      playRankUpSound(rank.index);

      setTimeout(() => {
        rankUpOverlay.classList.remove('active');
      }, 1500);
    }

    function renderText() {
      game.innerHTML = "";
      for (let i = 0; i < text.length; i++) {
        const span = document.createElement("span");
        span.className = "char pending";
        span.textContent = text[i] === " " ? "\u00A0" : text[i];
        game.appendChild(span);
      }
    }

    function triggerSRankEffects(isActivating) {
        if (isActivating && !isSRankActive) {
            isSRankActive = true;
            fadeAudioVolume(gameMusic, MAX_VOLUME, 500); 

            game.classList.add('s-rank-active');
            input.classList.add('s-rank-active');

        } else if (!isActivating && isSRankActive) {
            isSRankActive = false;
            fadeAudioVolume(gameMusic, BASE_VOLUME, 500);

            game.classList.remove('s-rank-active');
            input.classList.remove('s-rank-active');
        }
    }

    function updateStats() {
      scoreValue.textContent = score.toLocaleString();
      comboValue.textContent = combo + "x";

      const currentRank = getCurrentRank();
      
      if (currentRank.index > previousRankIndex && gameActive) {
        triggerRankUpAnimation(currentRank);
      }
      previousRankIndex = currentRank.index;

      if (currentRank.index >= 4) {
          triggerSRankEffects(true);
      } else {
          triggerSRankEffects(false);
      }

      if (hypeValue.textContent !== currentRank.name) {
        hypeValue.textContent = currentRank.name;
        hypeValue.style.transform = "scale(1.4)";
        setTimeout(() => hypeValue.style.transform = "scale(1)", 150);
      }
      hypeValue.style.color = currentRank.color;

      const nextRank = RANKS[currentRank.index + 1] || currentRank;
      const currentMin = currentRank.min;
      const currentMax = nextRank.min === currentMin ? currentMin + 30 : nextRank.min;
      const pct = Math.min(100, Math.max(0, ((hypePoints - currentMin) / (currentMax - currentMin)) * 100));
      hypeBar.style.width = pct + "%";

      if (currentRank.name === "HERO") {
        document.body.classList.add("frenzy");
      } else {
        document.body.classList.remove("frenzy");
      }

      if (startTime && charCount > 0) {
        const minutes = (Date.now() - startTime) / 60000;
        const wpm = Math.round((charCount / 5) / Math.max(minutes, 0.01));
        wpmValue.textContent = wpm;
        maxWpm = Math.max(maxWpm, wpm);
      }
    }

    function spawnParticles(x, y, color = "#00ff88") {
      for (let i = 0; i < 6; i++) {
        const p = document.createElement("div");
        p.className = "particle";
        const size = Math.random() * 6 + 4;
        p.style.width = size + "px";
        p.style.height = size + "px";
        p.style.background = color;
        p.style.left = x + "px";
        p.style.top = y + "px";
        const angle = (Math.PI * 2 * i) / 6;
        const dist = 30 + Math.random() * 40;
        p.style.setProperty("--tx", Math.cos(angle) * dist + "px");
        p.style.setProperty("--ty", Math.sin(angle) * dist + "px");
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 800);
      }
    }

    function showTimePopup(x, y, amount, isPositive) {
      const p = document.createElement("div");
      p.className = `time-pop ${isPositive ? "positive" : "negative"}`;
      p.textContent = `${isPositive ? "+" : ""}${amount}s`;
      p.style.left = x + "px";
      p.style.top = (y - 20) + "px";
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 800);
    }

    function showComboPopup(textStr) {
      const popup = document.createElement("div");
      popup.className = "combo-popup";
      popup.textContent = textStr;
      popup.style.left = "50%";
      popup.style.top = "38%";
      popup.style.transform = "translateX(-50%)";
      document.body.appendChild(popup);
      setTimeout(() => popup.remove(), 800);
    }

    function nextText() {
      const currentPhrases = MUSIC_LIBRARY[currentSongKey].phrases;
      text = currentPhrases[Math.floor(Math.random() * currentPhrases.length)];
      
      renderText();
      input.value = "";
      correctCharsCount = 0;
      input.disabled = false;
      input.classList.remove("error");
      
      // Auto-foco ideal para celulares
      setTimeout(() => input.focus(), 50);
      
      timeLeft = Math.min(maxTime, timeLeft + 4);
    }

    // Facilita o foco no input ao tocar no quadro de texto no celular
    game.addEventListener("click", () => {
      if (gameActive && !input.disabled) {
        input.focus();
      }
    });

    function startGame() {
      initAudio();
      playGameMusic();

      score = 0;
      hypePoints = 0;
      combo = 0;
      highestRankIndex = 0;
      currentRankIndex = 0;
      previousRankIndex = 0;
      charCount = 0;
      maxWpm = 0;
      timeLeft = maxTime;
      correctCharsCount = 0;
      gameActive = true;
      isSRankActive = false;
      startTime = Date.now();
      overlay.classList.remove("active");
      
      songSelect.disabled = true;
      quitBtn.style.display = "block";
      nextText();
      playBtn.style.display = "none";
      triggerSRankEffects(false);
      
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft -= 0.1;
        const pct = Math.max(0, (timeLeft / maxTime) * 100);
        timerFill.style.width = pct + "%";
        timerFill.classList.toggle("danger", pct < 25);
        
        if (hypePoints > 0) {
          hypePoints = Math.max(0, hypePoints - 0.08);
          updateStats();
        }

        if (timeLeft <= 0) {
          endGame();
        }
      }, 100);
    }

    function endGame() {
      gameActive = false;
      clearInterval(timerInterval);
      input.disabled = true;
      input.blur();
      songSelect.disabled = false;
      quitBtn.style.display = "none";
      document.body.classList.remove("frenzy");
      triggerSRankEffects(false);
      
      playMenuMusic();

      document.getElementById("finalScore").textContent = score.toLocaleString();
      document.getElementById("finalRank").textContent = RANKS[highestRankIndex].name;
      document.getElementById("finalRank").style.color = RANKS[highestRankIndex].color;
      document.getElementById("finalWpm").textContent = maxWpm;
      overlay.classList.add("active");
    }

    function returnToMenu() {
      gameActive = false;
      clearInterval(timerInterval);
      
      overlay.classList.remove("active");
      playBtn.style.display = "inline-block";
      quitBtn.style.display = "none";
      input.disabled = true;
      input.blur();
      input.value = "";
      input.placeholder = "Clique em PLAY para começar...";
      game.innerHTML = "";
      songSelect.disabled = false;
      
      score = 0;
      hypePoints = 0;
      combo = 0;
      previousRankIndex = 0;
      currentRankIndex = 0;
      charCount = 0;
      wpmValue.textContent = "0";
      timerFill.style.width = "100%";
      
      document.body.classList.remove("frenzy");
      triggerSRankEffects(false);
      updateStats();
      playMenuMusic();
    }

    playBtn.addEventListener("click", startGame);
    restartBtn.addEventListener("click", startGame);
    menuBtn.addEventListener("click", returnToMenu);

    window.addEventListener("keydown", (e) => {
      if (!gameActive && overlay.classList.contains("active") && (e.key === "Enter" || e.key === " ")) {
        e.preventDefault();
        startGame();
      }
    });

    input.addEventListener("keydown", (e) => {
      if (!gameActive) return;
      if (e.key === "Backspace" && input.value.length <= correctCharsCount) {
        e.preventDefault();
      }
    });

    input.addEventListener("input", () => {
      if (!gameActive) return;

      const typed = input.value;
      const chars = game.querySelectorAll(".char");

      if (typed.length < correctCharsCount) {
        input.value = text.substring(0, correctCharsCount);
        return;
      }

      if (typed.length > correctCharsCount) {
        const index = typed.length - 1;
        const typedChar = typed[index];
        const expectedChar = text[index];
        const charSpan = chars[index];

        if (typedChar === expectedChar) {
          correctCharsCount++;
          combo = Math.min(MAX_COMBO, combo + 1);
          hypePoints += 1.2;
          charCount++;

          const basePoints = 15;
          const comboMult = 1 + (combo * 0.15); 
          const currentRank = getCurrentRank();
          const rankMult = 1 + (currentRank.index * 0.25);
          score += Math.round(basePoints * comboMult * rankMult);

          timeLeft = Math.min(maxTime, timeLeft + 0.3);

          playSuccessSound(combo);

          if (charSpan) {
            const rect = charSpan.getBoundingClientRect();
            spawnParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, currentRank.color);
            showTimePopup(rect.left + rect.width / 2, rect.top, "0.3", true);
          }

          if (combo === MAX_COMBO && typed.length % 5 === 0) {
            showComboPopup("MAX COMBO 8x!");
          }

        } else {
          combo = 0; 
          
          const currentRank = getCurrentRank();
          if (currentRank.index > 0) {
            const previousRank = RANKS[currentRank.index - 1];
            hypePoints = previousRank.min;
          } else {
            hypePoints = 0;
          }

          timeLeft = Math.max(0, timeLeft - 2.0);

          playErrorSound();

          if (charSpan) {
            charSpan.classList.remove("pending", "current");
            charSpan.classList.add("wrong");
            const rect = charSpan.getBoundingClientRect();
            spawnParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, "#ff3333");
            showTimePopup(rect.left + rect.width / 2, rect.top, "-2", false);
            
            setTimeout(() => {
              if (charSpan.classList.contains("wrong")) {
                charSpan.classList.remove("wrong");
                charSpan.classList.add("current");
              }
            }, 300);
          }

          input.value = typed.substring(0, index);

          input.classList.add("error");
          setTimeout(() => input.classList.remove("error"), 250);
        }
      }

      for (let i = 0; i < text.length; i++) {
        const charSpan = chars[i];
        if (!charSpan) continue;

        const expected = text[i];
        const actual = input.value[i];

        if (charSpan.classList.contains("wrong")) continue;

        charSpan.classList.remove("pending", "correct", "current");

        if (i < input.value.length) {
          if (actual === expected) {
            charSpan.classList.add("correct");
          }
        } else if (i === input.value.length) {
          charSpan.classList.add("current");
        } else {
          charSpan.classList.add("pending");
        }
      }

      if (input.value === text) {
        nextText();
      }

      updateStats();
    });

    input.addEventListener("paste", (e) => e.preventDefault());
  </script>
</body>
